# Go Route müştəri tətbiqi — iOS (Mac lazım deyil, Codemagic bulud Mac-ində qurulur)
# Başlamazdan əvvəl Codemagic-də 2 şey hazır olmalıdır (IOS-QURASDIRMA.md-yə bax):
#   1) Team integrations -> App Store Connect açarı, adı: GoRoute-ASC
#   2) Apple Developer-də bundle ID: com.goroute.user
workflows:
  ios-release:
    name: Go Route iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GoRoute-ASC
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.goroute.user
      vars:
        BUNDLE_ID: "com.goroute.user"
    scripts:
      - name: Paketləri quraşdır
        script: npm install
      - name: Veb faylları www/ qovluğuna yığ
        script: node scripts/build-www.js
      - name: iOS layihəsini yarat
        script: npx cap add ios
      - name: Ikon yarat
        script: npx capacitor-assets generate --ios --iconBackgroundColor '#000000'
      - name: Info.plist icazə mətnləri və ayarlar
        script: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :NSLocationWhenInUseUsageDescription string Çatdırılma ünvanınızı xəritədə tapmaq və kuryerin məsafəsini hesablamaq üçün məkanınız istifadə olunur." "$PLIST"
          $PB -c "Add :NSCameraUsageDescription string Profil şəkli çəkmək üçün kameradan istifadə olunur." "$PLIST"
          $PB -c "Add :NSPhotoLibraryUsageDescription string Profil şəkli seçmək üçün şəkil kitabxanasına giriş istənilir." "$PLIST"
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          $PB -c "Print" "$PLIST" | head -40
      - name: Sinxronlaşdır
        script: npx cap sync ios
      - name: Build nömrəsini təyin et
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.0.0;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: İmza profilini tətbiq et
        script: xcode-project use-profiles
      - name: IPA qur
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
